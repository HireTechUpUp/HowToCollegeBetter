<!doctype html>
<!-- README 封面源文件：沿用 UP求职导师介绍稿封面（主题蓝 + 纸张浮雕 + 荧光绿标签）。
     导出：Chrome headless 截图 1920×960，见 assets/cover/README.md -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:960px; overflow:hidden; }
  body {
    position:relative; color:#fff;
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
    background:#1E4AFF url("../brand/封面背景-纸张浮雕.webp") right center / cover no-repeat;
  }
  .wrap { position:absolute; left:128px; top:118px; right:128px; bottom:96px; }
  .eyebrow { font-size:28px; font-weight:500; letter-spacing:7px; color:rgba(245,246,250,.82); }
  h1 { margin-top:84px; font-size:150px; line-height:1.08; font-weight:900; letter-spacing:4px; }
  h1 span { display:block; }
  .sub { margin-top:40px; font-size:40px; font-weight:400; line-height:1.5; color:rgba(245,246,250,.92); }
  .tags { position:absolute; left:0; bottom:0; display:flex; gap:22px; }
  .tags b { background:#E4FB6A; color:#111426; font-size:32px; font-weight:800; padding:14px 38px; border-radius:40px; }
  .by { position:absolute; right:0; bottom:8px; display:flex; align-items:center; gap:18px;
        font-size:26px; font-weight:500; letter-spacing:2px; color:rgba(245,246,250,.88); }
  .by img { height:52px; filter:brightness(0) invert(1); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">HOW TO COLLEGE BETTER</div>
    <h1><span>高性价比</span><span>大学生活指南</span></h1>
    <p class="sub">用最少的钱、时间和精力，换回大学四年最多的<br>身体、能力、选择权和工作机会</p>
    <div class="tags"><b>生活</b><b>学习</b><b>求职</b><b>毕业</b></div>
    <div class="by"><img src="../brand/UP求职-logo.png" alt="UP求职">出品</div>
  </div>
</body>
</html>
